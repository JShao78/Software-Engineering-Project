<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .login-box {
            width: min(340px, 90vw);
            padding: 24px;
            background: #ffffff;
            border: 1px solid #d5d5d5;
            border-radius: 6px;
        }

        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            margin-bottom: 6px;
        }

        .field input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            border: 1px solid #b9b9b9;
            border-radius: 4px;
        }

        .login-button {
            width: 100%;
            padding: 9px;
            border: 0;
            border-radius: 4px;
            background: #1f6feb;
            color: #ffffff;
            cursor: pointer;
        }

        .credentials {
            position: fixed;
            top: 10px;
            right: 10px;
            max-width: 380px;
            margin: 0;
            padding: 10px;
            font-size: 12px;
            line-height: 1.4;
            white-space: pre-line;
            background: #ffffff;
            border: 1px solid #d5d5d5;
            border-radius: 6px;
        }
    </style>
</head>
<body>
<p class="credentials">Admin: fabiola.jackson@bikes.shop Passwort: 555-5554
User 1: mireya.copeland@bikes.shop Passwort: 555-5555
User 2: genna.serrano@bikes.shop Passwort: 555-5556</p>

<form class="login-box" action="#" method="post">
    <div class="field">
        <label for="username">Nutzername (email)</label>
        <input id="username" name="username" type="email" required="required" />
    </div>
    <div class="field">
        <label for="password">Passwort</label>
        <input id="password" name="password" type="password" required="required" />
    </div>
    <button class="login-button" type="submit">Login</button>
</form>
</body>
</html>

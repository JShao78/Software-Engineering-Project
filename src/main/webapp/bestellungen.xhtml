<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:c="jakarta.tags.core">

<ui:composition template="templates/navbar.xhtml">

    <ui:define name="title">Bestellungen – Vertriebsunterstützung</ui:define>

    <ui:define name="content">
        <h1 class="page-title">Bestellungen</h1>

        <h:form id="orderPaginationForm" rendered="#{orderBoundary.totalPages() > 1}">
            <div class="pagination">
                <c:forEach begin="1" end="#{orderBoundary.totalPages()}" var="page">
                    <h:commandButton value="#{page}"
                                     styleClass="btn-page #{orderBoundary.currentPage eq page ? 'btn-page-active' : ''}">
                        <f:setPropertyActionListener target="#{orderBoundary.currentPage}" value="#{page}" />
                    </h:commandButton>
                </c:forEach>
            </div>
        </h:form>

        <div class="table-container" style="margin-top: 20px;">
            <h:dataTable value="#{orderBoundary.findPage()}"
                         var="order"
                         styleClass="data-table">

                <h:column>
                    <f:facet name="header">
                        <span class="col-header">Bestell-ID</span>
                    </f:facet>
                    <h:outputText value="#{order.orderId}" />
                </h:column>

                <h:column>
                    <f:facet name="header">
                        <span class="col-header">Bestelldatum</span>
                    </f:facet>
                    <h:outputText value="#{order.orderDate}">
                        <f:convertDateTime type="localDate" pattern="dd.MM.yyyy" />
                    </h:outputText>
                </h:column>

                <h:column>
                    <f:facet name="header">
                        <span class="col-header">Status</span>
                    </f:facet>
                    <h:outputText value="#{order.orderStatus}" />
                </h:column>

                <h:column>
                    <f:facet name="header">
                        <span class="col-header">Kunde</span>
                    </f:facet>
                    <h:outputText value="#{order.customer.firstName} #{order.customer.lastName}" />
                </h:column>

                <h:column>
                    <f:facet name="header">
                        <span class="col-header">Niederlassung</span>
                    </f:facet>
                    <h:outputText value="#{order.store.storeName}" />
                </h:column>

                <h:column>
                    <f:facet name="header">
                        <span class="col-header">Lieferdatum</span>
                    </f:facet>
                    <h:outputText value="#{order.requiredDate}">
                        <f:convertDateTime type="localDate" pattern="dd.MM.yyyy" />
                    </h:outputText>
                </h:column>

                <h:column>
                    <f:facet name="header">
                        <span class="col-header">Versanddatum</span>
                    </f:facet>
                    <h:outputText value="#{order.shippedDate}">
                        <f:convertDateTime type="localDate" pattern="dd.MM.yyyy" />
                    </h:outputText>
                </h:column>

            </h:dataTable>
        </div>

    </ui:define>

</ui:composition>
</html>

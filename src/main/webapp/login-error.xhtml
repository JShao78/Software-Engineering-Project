<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
<h:head>
    <meta charset="UTF-8" />
    <title>Login fehlgeschlagen</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .message-box {
            max-width: 420px;
            padding: 24px;
            background: #ffffff;
            border: 1px solid #d5d5d5;
            border-radius: 6px;
            text-align: center;
        }

        .title {
            margin: 0 0 10px;
            color: #b30000;
        }

        .message {
            margin: 0 0 16px;
            color: #222;
            line-height: 1.4;
        }

        .retry-link {
            display: inline-block;
            padding: 9px 12px;
            border-radius: 4px;
            text-decoration: none;
            background: #1f6feb;
            color: #ffffff;
        }
    </style>
</h:head>
<h:body>
<section class="message-box">
    <h1 class="title">Login fehlgeschlagen</h1>
    <p class="message">Benutzername oder Passwort sind nicht korrekt.</p>
    <h:link outcome="login" value="Erneut anmelden" styleClass="retry-link" />
</section>
</h:body>
</html>

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core">
<ui:composition template="templates/navbar.xhtml">

    <ui:define name="title">Produkte – Vertriebsunterstützung</ui:define>

    <ui:define name="content">
        <h1 class="page-title">Produkte</h1>

        <button type="button" class="btn-primary"
                onclick="document.getElementById('produktModal').style.display='flex'">
            + Produkt hinzufügen
        </button>

        <!--  Modal  -->
        <div id="produktModal" class="modal-overlay"
             onclick="if(event.target===this)this.style.display='none'">
            <div class="modal">

                <div class="modal-header">
                    <div class="modal-header-left">
                        <span class="modal-icon">📦</span>
                        <span class="modal-title">Neues Produkt anlegen</span>
                    </div>
                    <button type="button" class="modal-close"
                            onclick="document.getElementById('produktModal').style.display='none'">✕</button>
                </div>

                <h:form id="produktForm">
                    <div class="modal-body">

                        <div class="modal-section-label">Produktdaten</div>

                        <div class="form-group floating">
                            <h:inputText id="productname"
                                         value="#{productBoundary.productName}"
                                         styleClass="form-input"
                                         placeholder=" "
                                         required="true"/>
                            <label for="produktForm:productname" class="floating-label">Produktname *</label>
                            <span class="field-hint">z. B. Wireless Mouse</span>
                            <h:message for="productname" styleClass="field-error"/>
                        </div>

                        <div class="form-group floating">
                            <h:inputText id="brandname"
                                         value="#{productBoundary.price}"
                                         styleClass="form-input"
                                         placeholder=" "
                                         required="true">
                                <f:convertNumber minFractionDigits="2" maxFractionDigits="2" locale="de"/>
                            </h:inputText>
                            <label for="produktForm:brandname" class="floating-label">Brandname *</label>
                            <h:message for="brandname" styleClass="field-error"/>
                        </div>

                        <div class="form-group floating">
                            <h:inputText id="category"
                                         value="#{productBoundary.price}"
                                         styleClass="form-input"
                                         placeholder=" "
                                         required="true">
                                <f:convertNumber minFractionDigits="2" maxFractionDigits="2" locale="de"/>
                            </h:inputText>
                            <label for="produktForm:category" class="floating-label">Kategorien</label>
                            <h:message for="category" styleClass="field-error"/>
                        </div>
                        
						<div class="form-group floating">
                            <h:inputText id="modell_year"
                                         value="#{productBoundary.price}"
                                         styleClass="form-input"
                                         placeholder=" "
                                         required="true">
                                <f:convertNumber minFractionDigits="2" maxFractionDigits="2" locale="de"/>
                            </h:inputText>
                            <label for="produktForm:modell_year" class="floating-label">Modelljahr *</label>
                            <h:message for="modell_year" styleClass="field-error"/>
                        </div>
                        
						<div class="form-group floating">
                            <h:inputText id="price"
                                         value="#{productBoundary.price}"
                                         styleClass="form-input"
                                         placeholder=" "
                                         required="true">
                                <f:convertNumber minFractionDigits="2" maxFractionDigits="2" locale="de"/>
                            </h:inputText>
                            <label for="produktForm:price" class="floating-label">Stückpreis (€) *</label>
                            <span class="field-hint">z. B. 29,99</span>
                            <h:message for="price" styleClass="field-error"/>
                        </div>

                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn-secondary"
                                onclick="document.getElementById('produktModal').style.display='none'">
                            Abbrechen
                        </button>
                        <h:commandButton value="Speichern"
                                         action="#{productBoundary.addProduct()}"
                                         styleClass="btn-primary btn-save"/>
                    </div>
				</h:form>
            </div>
        </div>

		<!--  Product Table  -->
		<div class="table-container" style="margin-top: 20px;">
            <h:dataTable value="#{productBoundary.allProducts}"
                         var="product"
                         styleClass="data-table">
                <h:column>
                    <f:facet name="header"><span class="col-header">ID</span></f:facet>
                    <h:outputText value="#{product.id}" styleClass="uuid-text"/>
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">Produktname</span></f:facet>
                    <h:outputText value="#{product.productName}"/>
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">Brand</span></f:facet>
                    <h:outputText />
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">Kategorien</span></f:facet>
                    <h:outputText />
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">Modelljahr</span></f:facet>
                    <h:outputText />
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">Stückpreis</span></f:facet>
                    <h:outputText value="#{product.price}" styleClass="text-accent">
                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" locale="de"/>
                    </h:outputText>
                </h:column>
            </h:dataTable>
		</div>

    </ui:define>

</ui:composition>
</html>

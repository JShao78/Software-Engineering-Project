<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
	  xmlns:my="jakarta.faces.composite/components">
<ui:composition template="templates/navbar.xhtml">

    <ui:define name="title">Niederlassungen – Vertriebsunterstützung</ui:define>

    <ui:define name="content">
        <h1 class="page-title">Niederlassungen</h1>

		<my:pagination boundary="#{storesBoundary}" />
			
		<!--  Product Table  -->
		<div class="table-container" style="margin-top: 20px;">
            <h:dataTable var="product"
                         styleClass="data-table">
                <h:column>
                    <f:facet name="header"><span class="col-header">ID</span></f:facet>
                    <h:outputText styleClass="uuid-accent" />
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">Titel</span></f:facet>
                    <h:outputText styleClass="text-accent" />
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">Land</span></f:facet>
                    <h:outputText styleClass="text-accent" />
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">Stadt</span></f:facet>
                    <h:outputText styleClass="text-accent" />
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">Postleitzahl</span></f:facet>
                    <h:outputText styleClass="text-accent" />
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">Straße</span></f:facet>
                    <h:outputText styleClass="text-accent" />
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">E-Mail</span></f:facet>
                    <h:outputText styleClass="text-accent" />
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">Telefonnummer</span></f:facet>
                    <h:outputText styleClass="text-accent" />
                </h:column>
            </h:dataTable>
		</div>

    </ui:define>

</ui:composition>
</html>

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:my="jakarta.faces.composite/components">
<ui:composition template="templates/navbar.xhtml">

    <ui:define name="title">Kunden – Vertriebsunterstützung</ui:define>

    <ui:define name="content">
        <div class="orders-header">
            <h1 class="page-title orders-title">Kunden</h1>
            <p class="orders-subtitle">Insgesamt #{customerBoundary.count()} Kunden</p>
        </div>

        <my:pagination boundary="#{customerBoundary}" />

        <div class="table-container" style="margin-top: 20px;">
            <h:dataTable value="#{customerBoundary.findPage()}"
                         var="kunde"
                         styleClass="data-table">
                <h:column>
                    <f:facet name="header"><span class="col-header">ID</span></f:facet>
                    <h:outputText value="#{kunde.customerId}" styleClass="id-text"/>
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">Vorname</span></f:facet>
                    <h:outputText value="#{kunde.firstName}"/>
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">Nachname</span></f:facet>
                    <h:outputText value="#{kunde.lastName}" styleClass="text-accent"/>
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">E-Mail</span></f:facet>
                    <h:outputText value="#{kunde.email}"/>
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">Telefon</span></f:facet>
                    <h:outputText value="#{kunde.phone}"/>
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">Bundesstaat</span></f:facet>
                    <h:outputText value="#{kunde.state}"/>
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">Postleitzahl</span></f:facet>
                    <h:outputText value="#{kunde.zipCode}"/>
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">Straße</span></f:facet>
                    <h:outputText value="#{kunde.street}"/>
                </h:column>
            </h:dataTable>
        </div>

    </ui:define>

</ui:composition>
</html>

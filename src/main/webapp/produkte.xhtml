<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core">
<ui:composition template="/template.xhtml">

    <ui:define name="title">Produkte – Vertriebsunterstützung</ui:define>

    <ui:define name="content">
        <h1 class="page-title">Produkte</h1>
        <h:form id="kundenForm">
            <div class="form-card">
                <div class="form-row">
                    <div class="form-group">
                        <label for="product">Produktname</label>
                        <h:inputText id="product"
                                     value="#{productBoundary.productName}"
                                     styleClass="form-input"
                                     placeholder="Produktname" />
                    </div>
                    <div class="form-group">
                        <label for="price">Stückpreis</label>
                        <h:inputText id="price"
				     inputmode="decimal"
                                     value="#{productBoundary.price}"
                                     styleClass="form-input"
                                     placeholder="Stückpreis" />
                    </div>
                    <div class="form-group form-group-btn">
                        <h:commandButton value="Hinzufügen"
                                         styleClass="btn-primary"
                                         action="#{productBoundary.addProduct()}" />
                    </div>
                </div>
            </div>
        </h:form>

        <div class="table-container">
            <h:dataTable value="#{productBoundary.getAllProducts}"
                         var="product"
                         styleClass="data-table">
                <h:column>
                    <f:facet name="header">
                        <span class="col-header">ID</span>
                    </f:facet>
                    <h:outputText value="#{product.productNumber}" styleClass="text-accent" />
                </h:column>
		<h:column>
		    <f:facet name="header">
			<span class="col-header">Produktname</span>
		    </f:facet>
		    <h:outputText value="#{product.productName}" styleClass="text-accent" />
		</h:column>
		<h:column>
		    <f:facet name="header">
			<span class="col-header">Stückpreis</span>
		    </f:facet>
		    <h:outputText value="#{product.price}" styleClass="text-accent" />
		</h:column>
            </h:dataTable>
        </div>
    </ui:define>

</ui:composition>
</html>

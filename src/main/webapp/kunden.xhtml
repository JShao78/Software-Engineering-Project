<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core">
<ui:composition template="template.xhtml">

    <ui:define name="title">Kunden – Vertriebsunterstützung</ui:define>

    <ui:define name="content">
        <h1 class="page-title">Kunden</h1>

        <button type="button" class="btn-primary"
                onclick="document.getElementById('kundenModal').style.display='flex'">
            + Kunde hinzufügen
        </button>

        <!-- Auto-reopen modal if there was a validation error -->
        <h:panelGroup rendered="#{facesContext.maximumSeverity != null}">
            <script>
                window.onload = function() {
                    document.getElementById('kundenModal').style.display = 'flex';
                };
            </script>
        </h:panelGroup>

        <!--  Modal  -->
        <div id="kundenModal" class="modal-overlay"
             onclick="if(event.target===this)this.style.display='none'">
            <div class="modal">

                <div class="modal-header">
                    <div class="modal-header-left">
                        <span class="modal-icon">👤</span>
                        <span class="modal-title">Neuen Kunden anlegen</span>
                    </div>
                    <button type="button" class="modal-close"
                            onclick="document.getElementById('kundenModal').style.display='none'">✕</button>
                </div>

                <h:form id="kundenForm">
                    <div class="modal-body">

                        <h:messages globalOnly="true" styleClass="field-error" errorClass="field-error"/>

                        <div class="modal-section-label">Persönliche Daten</div>
                        <div class="field-row">
                            <div class="form-group floating">
                                <h:inputText id="vorname"
                                             value="#{customerBoundary.firstName}"
                                             styleClass="form-input"
                                             placeholder=" "
                                             required="true"/>
                                <label for="kundenForm:vorname" class="floating-label">Vorname *</label>
                                <span class="field-hint">z. B. Max</span>
                                <h:message for="vorname" styleClass="field-error"/>
                            </div>
                            <div class="form-group floating">
                                <h:inputText id="nachname"
                                             value="#{customerBoundary.lastName}"
                                             styleClass="form-input"
                                             placeholder=" "
                                             required="true"/>
                                <label for="kundenForm:nachname" class="floating-label">Nachname *</label>
                                <span class="field-hint">z. B. Mustermann</span>
                                <h:message for="nachname" styleClass="field-error"/>
                            </div>
                        </div>

                        <div class="modal-section-label">Kontaktdaten</div>
                        <div class="form-group floating">
                            <h:inputText id="email"
                                         value="#{customerBoundary.email}"
                                         styleClass="form-input"
                                         placeholder=" "/>
                            <label for="kundenForm:email" class="floating-label">E-Mail</label>
                            <span class="field-hint">z. B. max.mustermann@gmail.com</span>
                            <h:message for="email" styleClass="field-error"/>
                        </div>
                        <div class="form-group floating">
                            <h:inputText id="phone"
                                         value="#{customerBoundary.phone}"
                                         styleClass="form-input"
                                         placeholder=" ">
                                <f:validateRegex pattern="[\+\d\s\-\(\)]*"/>
                            </h:inputText>
                            <label for="kundenForm:phone" class="floating-label">Telefon</label>
                            <span class="field-hint">z. B. +49 30 123456</span>
                            <h:message for="phone" styleClass="field-error"/>
                        </div>

                        <div class="modal-section-label">Adresse</div>
                        <div class="form-group floating">
                            <h:inputText id="address"
                                         value="#{customerBoundary.address}"
                                         styleClass="form-input"
                                         placeholder=" "/>
                            <label for="kundenForm:address" class="floating-label">Adresse</label>
                            <span class="field-hint">z. B. Musterstraße 1, 10115 Berlin</span>
                        </div>

                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn-secondary"
                                onclick="document.getElementById('kundenModal').style.display='none'">
                            Abbrechen
                        </button>
                        <h:commandButton value="Speichern"
                                         action="#{customerBoundary.addCustomer()}"
                                         styleClass="btn-primary btn-save"/>
                    </div>
                </h:form>
            </div>
        </div>

        <!--  Customer Table  -->
        <div class="table-container" style="margin-top: 20px;">
            <h:dataTable value="#{customerBoundary.allCustomers}"
                         var="kunde"
                         styleClass="data-table">
                <h:column>
                    <f:facet name="header"><span class="col-header">UUID</span></f:facet>
                    <h:outputText value="#{kunde.id}" styleClass="uuid-text"/>
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">Vorname</span></f:facet>
                    <h:outputText value="#{kunde.firstName}"/>
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">Nachname</span></f:facet>
                    <h:outputText value="#{kunde.lastName}" styleClass="text-accent"/>
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">E-Mail</span></f:facet>
                    <h:outputText value="#{kunde.email}"/>
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">Telefon</span></f:facet>
                    <h:outputText value="#{kunde.phone}"/>
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">Adresse</span></f:facet>
                    <h:outputText value="#{kunde.address}"/>
                </h:column>
            </h:dataTable>
        </div>

    </ui:define>

</ui:composition>
</html>

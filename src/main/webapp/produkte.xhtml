<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:my="jakarta.faces.composite/components">
<ui:composition template="templates/navbar.xhtml">

    <ui:define name="title">Produkte – Vertriebsunterstützung</ui:define>

    <ui:define name="content">
        <div class="orders-header">
            <h1 class="page-title orders-title">Produkte</h1>
            <p class="orders-subtitle">Insgesamt #{productBoundary.count()} Produkte</p>
        </div>

        <my:pagination boundary="#{productBoundary}" />

			<!--  Product Table  -->
			<div class="table-container" style="margin-top: 20px;">
            <h:dataTable value="#{productBoundary.findPage()}"
                         var="product"
                         styleClass="data-table">
                <h:column>
                    <f:facet name="header"><span class="col-header">ID</span></f:facet>
                    <h:outputText value="#{product.productId}" styleClass="uuid-text"/>
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">Produktname</span></f:facet>
                    <h:outputText value="#{product.productName}"/>
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">Brand</span></f:facet>
                    <h:outputText value="#{product.brand.brandName}" />
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">Kategorien</span></f:facet>
                    <h:outputText value="#{product.category.categoryName}" />
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">Modelljahr</span></f:facet>
                    <h:outputText value="#{product.modelYear}" />
                </h:column>
                <h:column>
                    <f:facet name="header"><span class="col-header">Stückpreis</span></f:facet>
                    <h:outputText value="#{product.listPrice}" styleClass="text-accent">
                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" locale="de"/>
                    </h:outputText>
                </h:column>
            </h:dataTable>
		</div>

    </ui:define>

</ui:composition>
</html>
